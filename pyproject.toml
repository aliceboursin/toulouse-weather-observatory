[project]
name = "toulouse-data"
version = "0.1.0"
description = "How reliable are temperature forecasts for Toulouse, per station and per lead time?"
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.4",
    "google-cloud-bigquery>=3.0",
    "requests>=2.32",
]

[dependency-groups]
# Browser checks in metabase/verify_*.py. They drive the installed Microsoft
# Edge, so no browser download is needed.
dev = [
    "playwright>=1.49",
]

[tool.uv]
package = false
