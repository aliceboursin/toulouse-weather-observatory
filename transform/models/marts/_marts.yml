version: 2

models:
  - name: forecast_comparison
    description: >
      Every forecast with the observation it is compared against, one row per
      station, target hour and lead time. Forecasts with no usable observation
      are kept, with a null error.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, valid_at, lead_days]
    columns:
      - name: station_id
        description: Toulouse Métropole station number.
        data_tests:
          - not_null
      - name: valid_at
        description: Forecast target hour, in UTC.
        data_tests:
          - not_null
      - name: valid_at_local
        description: valid_at in Toulouse local time (Europe/Paris).
      - name: valid_date_local
        description: Local date of valid_at. Used by date filters.
      - name: valid_hour_local
        description: Local hour of valid_at, 0 to 23.
      - name: lead_days
        description: Days between the forecast being issued and valid_at (1 to 7), or 0 for the most recent model run.
        data_tests:
          - not_null
      - name: forecast_kind
        description: "'forecast' for leads 1 to 7, 'current_run_reference' for lead 0."
        data_tests:
          - not_null
      - name: forecast_temperature_c
        description: Forecast air temperature 2 m above ground, in °C.
      - name: observed_temperature_c
        description: Observation used for the comparison, in °C. Null if no reading exists at the target time or 15 minutes later.
      - name: observation_method
        description: "'centered_30min', 'preceding_15min' or 'following_15min'. Null if there is no observation."
      - name: observation_status
        description: "'observed', 'future_at_ingestion' or 'missing_observation'."
        data_tests:
          - not_null
      - name: error_c
        description: Signed error, forecast minus observation, in °C. Positive means the forecast was too warm. Null if either value is missing.
      - name: absolute_error_c
        description: Magnitude of error_c, in °C.

  - name: observation_coverage
    description: >
      Number of target hours per station and coverage category. Each station
      and target hour is counted once across all lead times.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, coverage_category]
    columns:
      - name: station_id
        description: Toulouse Métropole station number.
        data_tests:
          - not_null
      - name: station_label
        description: Readable station label from stg_stations, for example '11 - Toulouse Soupetard'.
        data_tests:
          - not_null
      - name: coverage_category
        description: >
          The observation method for hours with an observation
          ('centered_30min', 'preceding_15min', 'following_15min').
          Otherwise 'future_at_ingestion' for hours after the forecast
          ingestion time, or 'missing_observation'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['centered_30min', 'preceding_15min', 'following_15min', 'future_at_ingestion', 'missing_observation']
      - name: station_hours
        description: Number of target hours in this category for this station.
        data_tests:
          - not_null
      - name: share_of_station_hours
        description: >
          station_hours divided by all of the station's target hours, future
          hours included. It shows how target hours are distributed across
          categories. It is not the coverage rate; see
          station_observation_coverage.

  - name: station_observation_coverage
    description: >
      Default observation coverage rate per station: comparable target hours
      divided by non-future target hours. Future hours are reported
      separately and are not in the denominator.
    columns:
      - name: station_id
        description: Toulouse Métropole station number.
        data_tests:
          - not_null
          - unique
      - name: station_label
        description: Readable station label from stg_stations, for example '11 - Toulouse Soupetard'.
        data_tests:
          - not_null
      - name: target_hours
        description: Number of forecast target hours for this station.
        data_tests:
          - not_null
      - name: future_hours
        description: Target hours after the forecast ingestion time, with no observation.
        data_tests:
          - not_null
      - name: non_future_hours
        description: target_hours minus future_hours. The denominator of the coverage rate.
        data_tests:
          - not_null
      - name: comparable_hours
        description: Target hours with a usable observation (any observation method).
        data_tests:
          - not_null
      - name: missing_hours
        description: Non-future target hours with no usable observation.
        data_tests:
          - not_null
      - name: observation_coverage_rate
        description: comparable_hours divided by non_future_hours, between 0 and 1. Null if the station has no non-future hours.

  - name: forecast_reliability
    description: >
      Default reliability metrics: forecast error by station and lead time,
      for leads 1 to 7 only.
    data_tests:
      - unique_combination:
          arguments:
            columns: [station_id, lead_days]
    columns:
      - name: station_id
        description: Toulouse Métropole station number.
        data_tests:
          - not_null
      - name: station_label
        description: Readable station label from stg_stations, for example '11 - Toulouse Soupetard'.
        data_tests:
          - not_null
      - name: lead_days
        description: Days between the forecast being issued and the target hour.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: valid_comparisons
        description: Number of forecasts with a computed error.
        data_tests:
          - not_null
      - name: mean_absolute_error_c
        description: Mean of absolute_error_c, in °C. Null if there is no valid comparison.
      - name: mean_signed_error_c
        description: Mean of error_c (forecast minus observation), in °C. Positive means forecasts ran too warm.
      - name: non_future_hours
        description: The station's non-future target hours, from station_observation_coverage. The same on each of the station's rows.
      - name: observation_coverage_rate
        description: The station's observation coverage rate, from station_observation_coverage. The same on each of the station's rows.

  - name: current_run_reference_error
    description: >
      Error of the lead 0 values by station. Lead 0 is the most recent model
      run, not a forecast issued in advance; it is a reference, not part of
      the default reliability metrics.
    columns:
      - name: station_id
        description: Toulouse Métropole station number.
        data_tests:
          - not_null
          - unique
      - name: station_label
        description: Readable station label from stg_stations, for example '11 - Toulouse Soupetard'.
        data_tests:
          - not_null
      - name: lead_days
        description: Always 0.
        data_tests:
          - accepted_values:
              arguments:
                values: [0]
                quote: false
      - name: valid_comparisons
        description: Number of lead 0 values with a computed error.
        data_tests:
          - not_null
      - name: mean_absolute_error_c
        description: Mean of absolute_error_c, in °C.
      - name: mean_signed_error_c
        description: Mean of error_c (lead 0 value minus observation), in °C.
