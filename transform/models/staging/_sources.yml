version: 2

sources:
  - name: raw
    description: Files loaded as-is from the ingestion scripts.
    tables:
      - name: stations
        description: One row per ingested station, with its coordinates and source dataset id.
      - name: observations
        description: >
          15-minute temperature records from the Toulouse Métropole stations,
          exactly as published (including -50 °C readings and duplicates).
      - name: forecasts
        description: >
          Hourly Open-Meteo temperature forecasts at each station's
          coordinates, one row per station, target hour and lead time.
          The ingestion skips null temperatures, so a missing forecast is a
          missing row.
